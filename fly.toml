# Config de Fly.io para el backend de Finx.
# Antes del primer deploy: `fly launch --no-deploy` para fijar el nombre/region
# definitivos, y `fly secrets set GROQ_API_KEY=... SUPABASE_URL=... SUPABASE_SECRET_KEY=...`
# (nunca pongas esos valores aqui, este archivo se sube al repo).

app = "finx-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
