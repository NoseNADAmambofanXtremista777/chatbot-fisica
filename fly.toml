# Config de Fly.io para el backend de Finx.
# Antes de depender de secrets: `fly secrets set GROQ_API_KEY=... SUPABASE_URL=...
# SUPABASE_SECRET_KEY=...` (nunca pongas esos valores aqui, este archivo se sube al repo).

app = "chatbot-fisica"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Nunca se duerme: siempre hay al menos una maquina corriendo (esto tiene
  # costo continuo, ya no entra en el uso "gratis" de Fly.io).
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
