<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Física AK</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown & KaTeX para Matemáticas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --void: #060914;
            --panel: #0d1326;
            --panel-2: #141b36;
            --line: rgba(120, 150, 255, 0.16);
            --plasma: #22e4ff;
            --ultraviolet: #7a5cff;
            --text: #e8ecff;
            --muted: #8c96bd;
            --danger: #ff6b8b;
            --glow: 0 0 24px rgba(34, 228, 255, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
            background: var(--void);
            color: var(--text);
            overflow: hidden;
        }

        /* Fondo: cuadrícula + dos campos de luz */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(600px 400px at 85% -5%, rgba(122, 92, 255, 0.28), transparent 70%),
                radial-gradient(500px 380px at 5% 105%, rgba(34, 228, 255, 0.18), transparent 70%),
                linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 44px 44px,
                linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 44px 44px;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, rgba(0,0,0,0.35) 100%);
                    mask-image: radial-gradient(ellipse at center, #000 35%, rgba(0,0,0,0.35) 100%);
        }

        .app-layout { position: relative; z-index: 1; display: flex; width: 100%; height: 100%; }

        /* ---------- Barra lateral ---------- */
        .sidebar {
            width: 272px;
            background: rgba(13, 19, 38, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-right: 1px solid var(--line);
            display: flex; flex-direction: column;
            padding: 1.1rem; gap: 1rem;
            z-index: 20;
            transition: transform 0.25s ease;
        }

        .brand { display: flex; align-items: center; gap: 0.7rem; padding: 0.2rem 0.2rem 0.4rem; }
        .brand-mark {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1.5px solid var(--plasma);
            position: relative; box-shadow: var(--glow);
            flex: none;
        }
        .brand-mark::before, .brand-mark::after {
            content: ""; position: absolute; border-radius: 50%;
        }
        .brand-mark::before { inset: 9px; background: radial-gradient(circle, var(--plasma), var(--ultraviolet)); }
        .brand-mark::after {
            inset: -5px; border: 1px dashed rgba(122, 92, 255, 0.6);
            animation: orbit 14s linear infinite;
        }
        @keyframes orbit { to { transform: rotate(360deg); } }
        .brand-name { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; }
        .brand-sub { font-size: 0.75rem; color: var(--muted); }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--ultraviolet), #4f7bff);
            color: #fff; border: none;
            padding: 0.8rem 1rem; border-radius: 12px;
            font: inherit; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 6px 22px rgba(122, 92, 255, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(122, 92, 255, 0.5); }

        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; }
        .chat-list::-webkit-scrollbar, .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-list::-webkit-scrollbar-thumb, .chat-box::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 6px; }

        .chat-item {
            padding: 0.7rem 0.85rem;
            background: transparent;
            border-radius: 10px; cursor: pointer;
            font-size: 0.92rem; color: var(--muted);
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            border: 1px solid transparent;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .chat-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .chat-item:hover { background: var(--panel-2); color: var(--text); }
        .chat-item.active {
            background: var(--panel-2); color: #fff;
            border-color: rgba(34, 228, 255, 0.45);
            box-shadow: inset 3px 0 0 var(--plasma);
        }

        .delete-btn {
            background: none; border: none; color: var(--danger);
            cursor: pointer; font-size: 0.9rem; padding: 2px 5px; display: none;
        }
        .chat-item:hover .delete-btn, .chat-item.active .delete-btn { display: inline; }

        /* ---------- Chat ---------- */
        .chat-container { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }

        header {
            padding: 0.9rem 1.6rem;
            border-bottom: 1px solid var(--line);
            background: rgba(13, 19, 38, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; gap: 0.9rem;
        }
        header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.01em; }
        header p { font-size: 0.8rem; color: var(--muted); }
        .menu-btn {
            display: none; background: var(--panel-2); color: var(--text);
            border: 1px solid var(--line); border-radius: 10px;
            width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer;
        }

        .chat-box {
            flex: 1; padding: 1.8rem 1.6rem; overflow-y: auto;
            display: flex; flex-direction: column; gap: 1.1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: min(75%, 760px);
            padding: 0.95rem 1.2rem;
            border-radius: 16px;
            line-height: 1.65; font-size: 1rem;
            word-wrap: break-word; overflow-wrap: anywhere;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--ultraviolet), #4f7bff);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 6px 24px rgba(79, 123, 255, 0.28);
        }

        .bot-message {
            align-self: flex-start;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-left: 2px solid var(--plasma);
            border-bottom-left-radius: 4px;
            box-shadow: 0 0 30px rgba(34, 228, 255, 0.06);
        }

        .bot-message h1, .bot-message h2, .bot-message h3 { color: var(--plasma); margin: 0.8rem 0 0.4rem; font-weight: 600; }
        .bot-message h1 { font-size: 1.3rem; } .bot-message h2 { font-size: 1.15rem; } .bot-message h3 { font-size: 1.05rem; }
        .bot-message p { margin-bottom: 0.6rem; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin-left: 1.5rem; margin-bottom: 0.6rem; }
        .bot-message code { background: var(--panel-2); padding: 1px 6px; border-radius: 5px; font-size: 0.92em; color: #b9c6ff; }
        .bot-message pre { background: var(--void); border: 1px solid var(--line); padding: 0.9rem; border-radius: 10px; overflow-x: auto; margin-bottom: 0.6rem; }
        .bot-message pre code { background: none; padding: 0; }
        .bot-message a { color: var(--plasma); }
        .katex-display { margin: 0.8em 0 !important; overflow-x: auto; overflow-y: hidden; }

        /* Bienvenida */
        .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
        .chip {
            background: transparent; color: var(--plasma);
            border: 1px solid rgba(34, 228, 255, 0.4);
            padding: 0.45rem 0.85rem; border-radius: 999px;
            font: inherit; font-size: 0.88rem; cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .chip:hover { background: rgba(34, 228, 255, 0.1); box-shadow: var(--glow); }

        /* Cargando */
        .loading {
            align-self: flex-start; color: var(--muted);
            display: flex; align-items: center; gap: 0.7rem;
            padding: 0.6rem 1rem; font-size: 0.92rem;
        }
        .dots { display: inline-flex; gap: 5px; }
        .dots i {
            width: 7px; height: 7px; border-radius: 50%; background: var(--plasma);
            animation: pulse 1.1s ease-in-out infinite;
        }
        .dots i:nth-child(2) { animation-delay: 0.15s; }
        .dots i:nth-child(3) { animation-delay: 0.3s; }
        @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.15); } }

        /* Entrada */
        .input-container {
            padding: 1rem 1.6rem 1.3rem;
            display: flex; gap: 0.8rem;
        }
        .input-wrap {
            flex: 1; display: flex; gap: 0.7rem;
            background: rgba(13, 19, 38, 0.85);
            border: 1px solid var(--line);
            border-radius: 16px; padding: 0.45rem 0.45rem 0.45rem 1.1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap:focus-within { border-color: var(--plasma); box-shadow: var(--glow); }

        input {
            flex: 1; min-width: 0; background: transparent; border: none; outline: none;
            color: var(--text); font: inherit; font-size: 1rem;
        }
        input::placeholder { color: var(--muted); }

        button.send-btn {
            padding: 0.75rem 1.6rem;
            background: linear-gradient(135deg, var(--plasma), #3b9bff);
            color: #04121c; border: none; border-radius: 12px;
            font: inherit; font-weight: 700; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
        }
        button.send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--glow); }
        button.send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        button:focus-visible, .chat-item:focus-visible { outline: 2px solid var(--plasma); outline-offset: 2px; }

        .overlay { display: none; }

        /* ---------- Móvil ---------- */
        @media (max-width: 800px) {
            .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .overlay.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10; }
            .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
            .message { max-width: 90%; }
            header, .chat-box, .input-container { padding-left: 1rem; padding-right: 1rem; }
            button.send-btn { padding: 0.75rem 1.1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- Barra Lateral -->
    <div class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark"></div>
            <div>
                <div class="brand-name">Física AK</div>
                <div class="brand-sub">Tu asistente de física</div>
            </div>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">➕ Nuevo chat</button>
        <div class="chat-list" id="chatList"></div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

    <!-- Área de Chat -->
    <div class="chat-container">
        <header>
            <button class="menu-btn" onclick="toggleSidebar()" aria-label="Abrir historial">☰</button>
            <div>
                <h1>⚡ Bot Física AK</h1>
                <p>Pregunta sobre teoría o resuelve ejercicios paso a paso</p>
            </div>
        </header>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-container">
            <div class="input-wrap">
                <input type="text" id="userInput" placeholder="Escribe tu pregunta sobre física aquí..." onkeydown="handleKeyPress(event)" autocomplete="off">
                <button class="send-btn" onclick="sendMessage()" id="sendBtn">Enviar</button>
            </div>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatList = document.getElementById('chatList');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    // Cargar chats guardados o iniciar arreglo vacío
    let allSessions = JSON.parse(localStorage.getItem('physics_chats')) || {};
    let currentSessionId = localStorage.getItem('current_physics_session') || null;

    // Iniciar aplicación
    initApp();

    function initApp() {
        if (!currentSessionId || !allSessions[currentSessionId]) {
            createNewChat();
        } else {
            renderSidebar();
            loadSession(currentSessionId);
        }
    }

    function toggleSidebar(force) {
        const open = typeof force === 'boolean' ? force : !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', open);
        overlay.classList.toggle('show', open);
    }

    function createNewChat() {
        const newId = 'session_' + Date.now();
        allSessions[newId] = {
            title: 'Nueva conversación',
            history: []
        };
        currentSessionId = newId;
        saveToLocalStorage();
        renderSidebar();
        loadSession(newId);
    }

    function renderWelcome() {
        appendMessage('👋 ¡Hola! Soy tu asistente de física. ¿En qué tema o ejercicio te puedo ayudar hoy?', 'bot', false);
        const chips = document.createElement('div');
        chips.className = 'chips';
        [
            'Explícame la ley de Coulomb',
            '¿Qué es un campo magnético?',
            'Resuélveme un ejercicio paso a paso'
        ].forEach(t => {
            const b = document.createElement('button');
            b.className = 'chip';
            b.innerText = t;
            b.onclick = () => sendMessage(t);
            chips.appendChild(b);
        });
        chatBox.lastElementChild.appendChild(chips);
    }

    function loadSession(sessionId) {
        currentSessionId = sessionId;
        localStorage.setItem('current_physics_session', sessionId);
        renderSidebar();
        toggleSidebar(false);

        chatBox.innerHTML = '';
        const session = allSessions[sessionId];

        if (!session.history || session.history.length === 0) {
            renderWelcome();
        } else {
            session.history.forEach(msg => {
                appendMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', false);
            });
        }
    }

    function renderSidebar() {
        chatList.innerHTML = '';
        Object.keys(allSessions).reverse().forEach(id => {
            const item = document.createElement('div');
            item.className = `chat-item ${id === currentSessionId ? 'active' : ''}`;
            item.tabIndex = 0;
            item.onclick = () => loadSession(id);
            item.onkeydown = (e) => { if (e.key === 'Enter') loadSession(id); };

            const titleSpan = document.createElement('span');
            titleSpan.innerText = allSessions[id].title;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerText = '🗑️';
            deleteBtn.setAttribute('aria-label', 'Eliminar chat');
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteChat(id);
            };

            item.appendChild(titleSpan);
            item.appendChild(deleteBtn);
            chatList.appendChild(item);
        });
    }

    function deleteChat(id) {
        delete allSessions[id];
        if (currentSessionId === id) {
            const remainingKeys = Object.keys(allSessions);
            if (remainingKeys.length > 0) {
                currentSessionId = remainingKeys[remainingKeys.length - 1];
            } else {
                createNewChat();
                return;
            }
        }
        saveToLocalStorage();
        renderSidebar();
        loadSession(currentSessionId);
    }

    function saveToLocalStorage() {
        localStorage.setItem('physics_chats', JSON.stringify(allSessions));
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }

    async function sendMessage(preset) {
        const text = (typeof preset === 'string' ? preset : userInput.value).trim();
        if (!text || sendBtn.disabled) return;

        // Si el chat está vacío, quitar la bienvenida visual
        if (allSessions[currentSessionId].history.length === 0) chatBox.innerHTML = '';

        appendMessage(text, 'user', true);
        userInput.value = '';

        // Actualizar título del chat si es el primer mensaje
        if (allSessions[currentSessionId].history.length === 1) {
            allSessions[currentSessionId].title = text.length > 22 ? text.substring(0, 22) + '...' : text;
            saveToLocalStorage();
            renderSidebar();
        }

        userInput.disabled = true;
        sendBtn.disabled = true;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading';
        loadingDiv.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span>Pensando la respuesta...</span>';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const historyForBackend = allSessions[currentSessionId].history.slice(0, -1);

            const response = await fetch('https://chatbot-fisica-backend.onrender.com/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    history: historyForBackend
                })
            });

            const data = await response.json();
            chatBox.removeChild(loadingDiv);

            if (response.ok) {
                appendMessage(data.response, 'bot', true);
            } else {
                appendMessage('❌ Error: ' + (data.detail || 'Error procesando solicitud.'), 'bot', false);
            }

        } catch (error) {
            if (loadingDiv.parentNode) chatBox.removeChild(loadingDiv);
            appendMessage('❌ Error de conexión con FastAPI.', 'bot', false);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    function appendMessage(content, sender, saveToHistory = true) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');

        if (sender === 'user') {
            msgDiv.classList.add('user-message');
            msgDiv.innerText = content;
            if (saveToHistory) {
                allSessions[currentSessionId].history.push({ role: 'user', content: content });
            }
        } else {
            msgDiv.classList.add('bot-message');
            msgDiv.innerHTML = marked.parse(content);
            renderMathInElement(msgDiv, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });
            if (saveToHistory) {
                allSessions[currentSessionId].history.push({ role: 'assistant', content: content });
            }
        }

        if (saveToHistory) saveToLocalStorage();

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
